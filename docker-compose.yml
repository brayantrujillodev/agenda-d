# =====================================================================
# AGENDA-D · Infraestructura y servicios
#
# ESTADO ACTUAL
#   Los tres perfiles levantan sin errores: los cuatro proyectos Java
#   existen y construyen su imagen con `--build`.
#
# PERFILES
#   --profile infra  → postgres + kafka + tópicos + consola + pgAdmin
#   --profile core   → postgres + kafka + tópicos + agenda-service
#   --profile full   → todo: los tres servicios, el gateway y las consolas
#
# Alguien del equipo tiene 8 GB de RAM: usen el perfil más pequeño que
# les sirva. Por eso hay límites de memoria en cada contenedor.
# =====================================================================

name: agenda-d

services:

  # -------------------------------------------------------------------
  # INFRAESTRUCTURA · lista para usarse
  # -------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: agd-postgres
    profiles: [infra, core, full]
    environment:
      POSTGRES_DB: ${DB_NAME:-agendad}
      POSTGRES_USER: ${DB_USER:-agendad}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agendad}
    ports:
      - "5432:5432"          # para conectar DBeaver o psql desde el equipo
    volumes:
      - pgdata:/var/lib/postgresql/data
      # La migración se aplica sola la primera vez que arranca el volumen.
      # Cuando exista agenda-service, Flyway toma el relevo.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agendad} -d ${DB_NAME:-agendad}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    networks: [agenda-net]

  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: agd-kafka
    profiles: [infra, core, full]
    environment:
      # Modo KRaft: sin ZooKeeper, un contenedor menos y menos RAM
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "29092:29092"        # desde el equipo: localhost:29092
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    networks: [agenda-net]

  # Declara los tópicos del contrato (docs/eventos/CONTRATO-EVENTOS.md) en
  # vez de depender del auto-create del broker: 3 particiones y 7 días de
  # retención, explícitos. Corre una vez y termina; es idempotente
  # (--if-not-exists + alter), así que relanzarlo no rompe nada.
  kafka-init:
    image: bitnamilegacy/kafka:3.7
    container_name: agd-kafka-init
    profiles: [infra, core, full]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        for t in citas.reservadas citas.canceladas citas.estado citas.dlq; do
          kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
          kafka-configs.sh --bootstrap-server kafka:9092 --alter \
            --entity-type topics --entity-name "$$t" --add-config retention.ms=604800000
        done
        kafka-topics.sh --bootstrap-server kafka:9092 --describe | grep -E '^Topic: citas'
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"
    mem_limit: 256m
    networks: [agenda-net]

  # Consola para ver tópicos, particiones y retrasos de consumo.
  # Útil para la sustentación.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: agd-kafka-ui
    profiles: [infra, full]
    environment:
      KAFKA_CLUSTERS_0_NAME: agenda-d
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_PROVECTUS: INFO
    ports:
      - "8090:8080"
    depends_on:
      kafka: { condition: service_healthy }
    mem_limit: 384m
    networks: [agenda-net]

  # Ver los datos guardados (citas, outbox, notificaciones, analítica) sin
  # instalar nada: http://localhost:5050. Sin login y con el servidor
  # AGENDA-D ya registrado (pgadmin/servers.json). Solo para desarrollo.
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: agd-pgadmin
    profiles: [infra, full]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@agendad.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-agendad}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    # libpq ignora un pgpass con permisos abiertos, y un archivo montado
    # desde Windows siempre los tiene: se crea dentro con 600 al arrancar.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        echo 'postgres:5432:*:${DB_USER:-agendad}:${DB_PASSWORD:-agendad}' > /tmp/pgpass
        && chmod 600 /tmp/pgpass
        && exec /entrypoint.sh
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 384m
    networks: [agenda-net]

  # -------------------------------------------------------------------
  # SERVICIOS · definidos, aún sin proyecto
  #
  # Cada uno se activa cuando exista su carpeta con pom.xml y Dockerfile.
  # Orden de construcción: agenda → notificaciones → gateway → analitica.
  # -------------------------------------------------------------------

  agenda-service:
    build: ./agenda-service
    container_name: agd-agenda
    profiles: [core, full]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-agendad}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-agendad}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-agendad}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Los DisconnectException de fetch son reconexiones normales de Kafka; solo ruido
      LOGGING_LEVEL_ORG_APACHE_KAFKA_CLIENTS_FETCHSESSIONHANDLER: WARN
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8081:8081"          # la ruta pública del cliente entra por aquí
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 512m
    networks: [agenda-net]

  notificaciones-service:
    build: ./notificaciones-service
    container_name: agd-notificaciones
    profiles: [full]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-agendad}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-agendad}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-agendad}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Los DisconnectException de fetch son reconexiones normales de Kafka; solo ruido
      LOGGING_LEVEL_ORG_APACHE_KAFKA_CLIENTS_FETCHSESSIONHANDLER: WARN
      # REGISTRO = guarda el mensaje en BD en vez de enviarlo. Sin costo.
      AGENDAD_CANAL_POR_DEFECTO: REGISTRO
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8082:8082"          # application.yml fija server.port: 8082
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    mem_limit: 512m
    networks: [agenda-net]

  gateway-graphql:
    build: ./gateway-graphql
    container_name: agd-gateway
    profiles: [full]
    environment:
      AGENDAD_AGENDA_URL: http://agenda-service:8081
      AGENDAD_ANALITICA_URL: http://analitica-service:8083
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8080:8080"          # el panel de recepción consume esto
    depends_on:
      # Si arrancara antes que analitica, metricasDelMes saldría en null con
      # SERVICIO_NO_DISPONIBLE en errors[] (no con ceros falsos), pero mejor
      # que el panel abra completo desde el primer intento.
      agenda-service: { condition: service_healthy }
      analitica-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 512m
    networks: [agenda-net]

  analitica-service:
    build: ./analitica-service
    container_name: agd-analitica
    profiles: [full]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-agendad}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-agendad}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-agendad}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Los DisconnectException de fetch son reconexiones normales de Kafka; solo ruido
      LOGGING_LEVEL_ORG_APACHE_KAFKA_CLIENTS_FETCHSESSIONHANDLER: WARN
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8083:8083"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 512m
    networks: [agenda-net]

  # PWA (reserva pública y panel de recepción). Archivos estáticos servidos
  # por nginx: sin build. El navegador llama a agenda-service (8081) y al
  # gateway (8080) desde la máquina del usuario, por eso usa localhost.
  web:
    image: nginx:1.27-alpine
    container_name: agd-web
    profiles: [core, full]
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 32m
    networks: [agenda-net]

volumes:
  pgdata:

networks:
  agenda-net:
    driver: bridge
