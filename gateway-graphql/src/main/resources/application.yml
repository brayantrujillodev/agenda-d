spring:
  application:
    name: gateway-graphql
  graphql:
    graphiql:
      enabled: true
    path: /graphql

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

agendad:
  cors:
    # El panel de recepción (web/panel.html, docs/TAREAS.md #20) llama a
    # /graphql por fetch() desde un origen distinto.
    origenes-permitidos: ${AGENDAD_CORS_ORIGENES:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500}
