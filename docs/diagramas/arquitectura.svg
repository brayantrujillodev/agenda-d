<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#37474f"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e65100"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a2f">AGENDA-D · Arquitectura implementada</text>

  <!-- Cliente -->
  <rect x="20" y="60" width="230" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="135" y="84" text-anchor="middle" font-weight="bold">PWA (web/ · nginx :5173)</text>
  <text x="135" y="106" text-anchor="middle">Reserva pública (sin cuenta)</text>
  <text x="135" y="124" text-anchor="middle">Panel de recepción</text>
  <text x="135" y="146" text-anchor="middle" font-size="11" fill="#555">HTML · CSS · JS · service worker</text>

  <!-- gateway -->
  <rect x="350" y="60" width="240" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="470" y="84" text-anchor="middle" font-weight="bold">gateway-graphql :8080</text>
  <text x="470" y="106" text-anchor="middle">panelRecepcion en 1 consulta</text>
  <text x="470" y="124" text-anchor="middle">5 queries · 8 mutaciones</text>
  <text x="470" y="146" text-anchor="middle" font-size="11" fill="#555">límites, errores en español, 429</text>

  <!-- agenda -->
  <rect x="20" y="250" width="270" height="130" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="155" y="274" text-anchor="middle" font-weight="bold">agenda-service :8081 (dominio)</text>
  <text x="155" y="296" text-anchor="middle">Cupos, reserva, gestión por token</text>
  <text x="155" y="314" text-anchor="middle">Servicios, profesionales, bloqueos</text>
  <text x="155" y="336" text-anchor="middle" font-size="11" fill="#555">INSERT cita + INSERT outbox</text>
  <text x="155" y="352" text-anchor="middle" font-size="11" fill="#555">(misma transacción)</text>
  <text x="155" y="368" text-anchor="middle" font-size="11" fill="#555">OutboxRelay @Scheduled → Kafka</text>

  <!-- kafka -->
  <rect x="370" y="250" width="220" height="130" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="480" y="274" text-anchor="middle" font-weight="bold">Kafka 3.7 (KRaft) :29092</text>
  <text x="480" y="298" text-anchor="middle" font-size="12">citas.reservadas</text>
  <text x="480" y="316" text-anchor="middle" font-size="12">citas.canceladas</text>
  <text x="480" y="334" text-anchor="middle" font-size="12">citas.estado</text>
  <text x="480" y="352" text-anchor="middle" font-size="12">citas.dlq (fallidos)</text>
  <text x="480" y="370" text-anchor="middle" font-size="11" fill="#555">clave = profesionalId · 3 part.</text>

  <!-- notificaciones -->
  <rect x="680" y="210" width="260" height="90" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="810" y="234" text-anchor="middle" font-weight="bold">notificaciones-service :8082</text>
  <text x="810" y="254" text-anchor="middle" font-size="12">Confirmación · cancelación</text>
  <text x="810" y="272" text-anchor="middle" font-size="12">Recordatorio 24 h · reintentos + DLQ</text>
  <text x="810" y="290" text-anchor="middle" font-size="11" fill="#555">dedup por eventoId</text>

  <!-- analitica -->
  <rect x="680" y="330" width="260" height="90" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="810" y="354" text-anchor="middle" font-weight="bold">analitica-service :8083</text>
  <text x="810" y="374" text-anchor="middle" font-size="12">Ocupación · inasistencia</text>
  <text x="810" y="392" text-anchor="middle" font-size="12">GET /v1/metricas</text>
  <text x="810" y="410" text-anchor="middle" font-size="11" fill="#555">dedup por eventoId</text>

  <!-- postgres -->
  <rect x="20" y="470" width="920" height="90" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="480" y="494" text-anchor="middle" font-weight="bold">PostgreSQL 16 :5432 · una base, tres esquemas · migraciones Flyway</text>
  <text x="160" y="528" text-anchor="middle" font-size="12">esquema agenda</text>
  <text x="160" y="546" text-anchor="middle" font-size="11" fill="#555">cita (EXCLUDE gist) · outbox …</text>
  <text x="480" y="528" text-anchor="middle" font-size="12">esquema notificaciones</text>
  <text x="480" y="546" text-anchor="middle" font-size="11" fill="#555">programacion · mensaje_fallido …</text>
  <text x="800" y="528" text-anchor="middle" font-size="12">esquema analitica</text>
  <text x="800" y="546" text-anchor="middle" font-size="11" fill="#555">metrica_diaria · evento_procesado</text>

  <!-- flechas REST/GraphQL -->
  <line x1="250" y1="90" x2="350" y2="90" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="300" y="82" text-anchor="middle" font-size="11">GraphQL</text>
  <line x1="135" y1="170" x2="135" y2="250" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="145" y="215" font-size="11">REST público</text>
  <line x1="420" y1="170" x2="250" y2="250" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="300" y="200" font-size="11">REST + X-Negocio-Id</text>
  <path d="M590 130 H820 V330" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="700" y="122" font-size="11">REST (métricas)</text>

  <!-- flechas Kafka -->
  <line x1="290" y1="315" x2="370" y2="315" stroke="#e65100" stroke-width="2" marker-end="url(#k)"/>
  <text x="330" y="306" text-anchor="middle" font-size="11" fill="#e65100">publica</text>
  <line x1="590" y1="290" x2="680" y2="260" stroke="#e65100" stroke-width="2" marker-end="url(#k)"/>
  <line x1="590" y1="340" x2="680" y2="372" stroke="#e65100" stroke-width="2" marker-end="url(#k)"/>
  <text x="640" y="320" text-anchor="middle" font-size="11" fill="#e65100">consumen</text>

  <!-- flechas a la BD -->
  <line x1="155" y1="380" x2="155" y2="470" stroke="#455a64" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="810" y1="300" x2="810" y2="330" stroke="#ffffff" stroke-width="1"/>
  <line x1="760" y1="300" x2="560" y2="470" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="850" y1="420" x2="820" y2="470" stroke="#455a64" stroke-width="1.4" marker-end="url(#a)"/>

  <text x="480" y="592" text-anchor="middle" font-size="11" fill="#555">Naranja: eventos asíncronos (Kafka) · Gris: llamadas síncronas (REST / GraphQL / SQL)</text>
</svg>
