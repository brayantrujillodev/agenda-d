<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#26382e">
  <meta name="description" content="Panel de recepción: agenda del día e indicadores del negocio.">
  <title>Panel de recepción</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>

  <header class="cabecera">
    <a class="cabecera__marca" href="./index.html">
      <span class="poste" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26">
          <rect x="7.5" y="3.5" width="9" height="17" rx="4.5" fill="#fbfaf6"/>
          <clipPath id="poste-c"><rect x="7.5" y="3.5" width="9" height="17" rx="4.5"/></clipPath>
          <g clip-path="url(#poste-c)" stroke-width="3.4">
            <path d="M2 8 L14 -4 M2 16 L18 0 M2 24 L22 4 M6 26 L26 6" stroke="#b23b3b"/>
            <path d="M-2 8 L10 -4 M-2 16 L10 4 M2 22 L14 10 M6 30 L18 18" stroke="#2f5c93"/>
          </g>
          <rect x="6.3" y="2" width="11.4" height="3" rx="1.5" fill="#c9a24b"/>
          <rect x="6.3" y="19" width="11.4" height="3" rx="1.5" fill="#c9a24b"/>
        </svg>
      </span>
      <span id="negocio-nombre">Panel de recepción</span>
    </a>
  </header>

  <main id="panel" class="contenedor">
    <p class="cargando">Cargando…</p>
  </main>

  <footer class="pie">
    <span class="pie__marca">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <rect x="8" y="4" width="8" height="16" rx="4" fill="currentColor"/>
        <rect x="7" y="2.5" width="10" height="2.6" rx="1.3" fill="currentColor"/>
        <rect x="7" y="18.9" width="10" height="2.6" rx="1.3" fill="currentColor"/>
      </svg>
      <span id="pie-nombre">Barbería El Corte</span>
    </span>
    <span class="pie__sep" aria-hidden="true"></span>
    <span class="pie__lema">Panel interno — no requiere cuenta, no es la pantalla del cliente.</span>
  </footer>

  <script src="config.js"></script>
  <script src="panel.js"></script>
</body>
</html>
