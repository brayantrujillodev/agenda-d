server:
  port: 8081

spring:
  application:
    name: agenda-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agendad}
    username: ${SPRING_DATASOURCE_USERNAME:agendad}
    password: ${SPRING_DATASOURCE_PASSWORD:agendad}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el único dueño del esquema. 'none': ni crea ni valida.
      # 'validate' es deseable, pero el tipo timestamptz choca con la
      # metadata de pgjdbc en algunas versiones y no puedo probarlo sin BD.
      # Se evaluará pasar a 'validate' cuando corra contra Postgres real.
      ddl-auto: none
    properties:
      hibernate:
        default_schema: agenda
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    default-schema: agenda
    # El perfil 'infra' del Compose ya deja el esquema creado (monta ./db en
    # el initdb de Postgres). Cuando ese es el caso, Flyway encuentra el
    # esquema 'agenda' poblado y sin su tabla de historial: baseline-on-migrate
    # lo marca como versión 1 en vez de reintentar el CREATE y fallar.
    # Sobre una base vacía (sin ese montaje) Flyway aplica V1 normalmente.
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # El relay publica una a una y espera el ack: no perder eventos pesa
      # más que la latencia. La idempotencia evita duplicados si reintenta.
      acks: all
      properties:
        enable.idempotence: true

  jackson:
    # Las respuestas del contrato no muestran campos nulos.
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

agendad:
  gestion:
    # Base para armar el enlace de gestión que se devuelve al reservar.
    base-url: ${AGENDAD_GESTION_BASE_URL:http://localhost:8081}
  outbox:
    # Cada cuánto el relay busca eventos pendientes y los publica.
    intervalo-ms: ${AGENDAD_OUTBOX_INTERVALO_MS:2000}
