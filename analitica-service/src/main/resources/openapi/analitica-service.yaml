openapi: 3.0.3

info:
  title: AGENDA-D · analitica-service
  version: 1.0.0
  description: |
    Proyecto de aula · Programación Avanzada · SOF-G2-NOC · Equipo 2

    Consume `citas.reservadas`, `citas.canceladas` y `citas.estado` por
    Kafka, actualiza `analitica.metrica_diaria` (deduplicando por
    `eventoId` contra `analitica.evento_procesado`, igual que
    `notificaciones-service`) y expone el endpoint de abajo, que el
    gateway GraphQL resuelve para el campo `metricas` del esquema
    (`docs/graphql/schema.graphqls`).

    **Simplificación documentada:** `ocupacion` estima los minutos
    disponibles como `profesionales-día con actividad × minutos_habiles_dia`
    (configurable, por defecto 600 = jornada 08:00–18:00). Calcularla contra
    el horario de atención real de cada profesional requeriría leer
    `agenda.horario_atencion`, que vive en otro esquema — este servicio no
    tiene llaves foráneas a él por diseño (ver CLAUDE.md).

    `topServicios` devuelve el `servicioId`, no el nombre:
    `analitica.metrica_diaria` no conoce los nombres, que viven en
    agenda-service. Ponerle nombre es trabajo del gateway GraphQL, que es
    quien compone datos de los dos servicios.

servers:
  - url: http://localhost:8083
    description: Local (puerto reservado en docker-compose.yml, perfil full)

tags:
  - name: Métricas
    description: Indicadores de ocupación e inasistencia del negocio

paths:

  /v1/metricas:
    get:
      tags: [Métricas]
      summary: Indicadores del negocio en un periodo
      parameters:
        - name: X-Negocio-Id
          in: header
          required: true
          description: Identificador del negocio (sin autenticación en este alcance)
          schema:
            type: string
            format: uuid
          example: 11111111-1111-1111-1111-111111111111
        - name: desde
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Métricas del periodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metricas'
              example:
                desde: '2026-08-01'
                hasta: '2026-08-31'
                totalCitas: 184
                atendidas: 160
                noAsistio: 18
                canceladas: 6
                ocupacion: 72.5
                tasaInasistencia: 9.8
                topServicios:
                  - servicioId: 22222222-2222-2222-2222-222222222222
                    cantidad: 120
        '400':
          description: Rango de fechas inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: DATOS_INVALIDOS
                mensaje: La fecha "desde" no puede ser posterior a "hasta".

  /actuator/health:
    get:
      tags: [Métricas]
      summary: Estado del servicio
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [UP, DOWN]

components:
  schemas:
    Metricas:
      type: object
      properties:
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        totalCitas:
          type: integer
        atendidas:
          type: integer
        noAsistio:
          type: integer
        canceladas:
          type: integer
        ocupacion:
          type: number
          description: Porcentaje 0-100. Minutos ocupados sobre minutos disponibles.
        tasaInasistencia:
          type: number
          description: Porcentaje 0-100.
        topServicios:
          type: array
          items:
            type: object
            properties:
              servicioId:
                type: string
                format: uuid
              cantidad:
                type: integer
                description: Reservas del servicio en el periodo
          description: Hasta 5, de más a menos reservado

    Error:
      type: object
      properties:
        codigo:
          type: string
        mensaje:
          type: string
          description: En español claro. Nunca un stacktrace.
