server.port: 8083
spring:
  application.name: analitica-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agendad}
    username: ${SPRING_DATASOURCE_USERNAME:agendad}
    password: ${SPRING_DATASOURCE_PASSWORD:agendad}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: analitica-service
      auto-offset-reset: earliest
      properties.spring.json.trusted.packages: '*'
management.endpoints.web.exposure.include: health,info
